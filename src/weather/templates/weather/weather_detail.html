{% extends "base.html" %}

{% block title %}Sol {{ sol.sol }}{% endblock title %}
{% block content %}
<div class="container mx-auto mt-5">
    <h1 class="text-3xl font-bold mb-4">Sol {{ sol.sol }} Weather Details</h1>
    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-xl font-semibold mb-4">Weather measurements</h2>
        {% include "weather/_weather_data.html" with compact=False %}
    </div>
    <a href="{% url 'weather:weather_list' %}" class="text-orange-600 mt-3 inline-block">Back to Weather List</a>
</div>
{% endblock content %}
