version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.15.2
    working_directory: ~/repo

jobs:
  test:
    executor: python-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y xvfb
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            python -m pip install -U pip
            pip install -r requirements.txt -r requirements-dev.txt
            playwright install --with-deps chromium
      - save_cache:
          key: pip-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Audit runtime dependencies
          command: |
            . venv/bin/activate
            pip-audit -r requirements.txt
      - run:
          name: Prepare clean test database
          command: rm -f src/db.sqlite3
      - run:
          name: Run Django migrations
          command: |
            . venv/bin/activate
            cd src
            python manage.py migrate
      - run:
          name: Create test user
          command: |
            . venv/bin/activate
            cd src
            python manage.py create_test_user
      # - run:
      #     name: Create test create_test_posts
      #     command: |
      #       . venv/bin/activate
      #       cd mars_weather_app
      #       python manage.py create_test_posts
      - run:
          name: Populate Weather table
          command: |
            . venv/bin/activate
            cd src
            python manage.py loaddata weather/fixtures/weather_fixture.json
      - run:
          name: Start Django server
          command: |
            . venv/bin/activate
            cd src
            python manage.py runserver 0.0.0.0:8000
          background: true
      - run:
          name: Start xvfb
          command: |
            Xvfb :99 -screen 0 1280x1024x24 &
      - run:
          name: Wait for server to start
          command: |
            . venv/bin/activate
            until curl -s http://localhost:8000 > /dev/null; do echo "Waiting for server..."; sleep 5; done
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            cd src
            export DISPLAY=:99
            export PYTHONPATH=$PYTHONPATH:$(pwd)/tests
            pytest --junitxml=reports/test-results.xml
      - store_test_results:
          path: src/reports
      - store_artifacts:
          path: src/reports
  deploy:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Deploy
          command: |
            # Replace with your real deploy step, see notes below.
            curl -fsS -X POST "$DEPLOY_HOOK_URL"

workflows:
  version: 2
  test-and-deploy:
    jobs:
      - test
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main